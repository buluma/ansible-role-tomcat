---
- become: true
  gather_facts: true
  handlers:
    - ansible.builtin.package:
        name: "{{ netcat_package }}"
        state: absent
      name: Uninstall netcat
  hosts: all
  name: Verify
  tasks:
    - ansible.builtin.package:
        name: "{{ netcat_package }}"
        state: present
      name: Install netcat
      notify:
        - Uninstall netcat
    - ansible.builtin.shell:
        cmd: nc --listen --keep-open 127.0.0.2 8080 &
      changed_when: false
      name: Let netcat listen on port 127.0.0.2:8080
    - ansible.builtin.uri:
        return_content: true
        url: http://localhost:8080/
      failed_when:
        - "'successfully installed Tomcat' in this.content"
      name: See if sensitive information is not exposed
      register: this
    - ansible.builtin.uri:
        return_content: true
        url: http://localhost:{{ item }}/
      delay: 3
      loop:
        - 8081
        - 8082
      name: See if the Tomcat 10.1 and 11 instances serve the neutral page
      register: this
      retries: 10
      until:
        - "'Please select an application' in (this.content | default(''))"
  vars:
    _netcat_package:
      Alpine: netcat-openbsd
      Debian: netcat-openbsd
      Suse: netcat-openbsd
      default: nc
    netcat_package:
      "{{ _netcat_package[ansible_facts['os_family'] ~ '-' ~ ansible_facts['distribution_major_version']]
      | default (_netcat_package[ansible_facts['os_family']] | default(_netcat_package['default']))
      }}"
